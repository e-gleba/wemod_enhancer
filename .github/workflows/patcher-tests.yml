# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: patcher-tests

on:
    push:
        branches: [main]
        paths:
            - "scripts/**"
            - "tests/**"
            - "readme.md"
            - ".github/workflows/patcher-tests.yml"
    pull_request:
        branches: [main]
        paths:
            - "scripts/**"
            - "tests/**"
            - "readme.md"
            - ".github/workflows/patcher-tests.yml"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    pytest:
        name: pytest py${{ matrix.python }} (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
                python: ["3.11", "3.13"]
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Setup Python ${{ matrix.python }}
              uses: actions/setup-python@v7
              with:
                  python-version: ${{ matrix.python }}

            - name: Install pytest
              run: python -m pip install --upgrade pytest

            - name: Run tests
              run: python -m pytest tests/ -q

            - name: CLI smoke test
              run: python scripts/wemod_enhancer.py list-patches

    shellcheck:
        name: shellcheck install.sh
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Install shellcheck
              run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

            - name: Lint install.sh
              run: shellcheck -S warning scripts/install.sh
