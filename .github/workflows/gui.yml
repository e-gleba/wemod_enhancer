# gui.yml
#
# CI matrix for the self-contained package (GUI + version.dll +
# wemod_enhancer.py). There is no build option: every configure
# produces all three, so this workflow is the full platform/compiler
# matrix - MSVC + pure Clang on windows-2022, LLVM-MinGW cross on
# ubuntu-24.04, GCC + Clang on ubuntu-24.04, GCC on ubuntu-24.04-arm.
#
# No bespoke setup steps: the GitHub runner images already ship
# MSVC / Clang / GCC / Ninja, and the llvm-mingw toolchain file
# (cmake/toolchains/llvm_mingw.cmake) auto-downloads the cross
# compiler on first configure.

name: gui_multiplatform_workflow

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache

jobs:
    build:
        name: ${{ matrix.name }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - {
                          name: windows-msvc-amd64,
                          os: windows-2022,
                          preset: msvc,
                      }
                    - {
                          name: windows-clang-amd64,
                          os: windows-2022,
                          preset: clang-windows-amd64,
                      }
                    - {
                          name: windows-llvm-mingw-amd64,
                          os: ubuntu-24.04,
                          preset: llvm-mingw-x86_64,
                      }
                    - {
                          name: linux-gcc-amd64,
                          os: ubuntu-24.04,
                          preset: linux-gcc-amd64,
                      }
                    - {
                          name: linux-clang-amd64,
                          os: ubuntu-24.04,
                          preset: linux-clang-amd64,
                      }
                    - {
                          name: linux-gcc-arm64,
                          os: ubuntu-24.04-arm,
                          preset: linux-gcc-arm64,
                      }

        steps:
            - uses: actions/checkout@v7

            - name: Restore CPM source cache
              uses: actions/cache@v6
              with:
                  path: ${{ env.CPM_SOURCE_CACHE }}
                  key: cpm-gui-${{ matrix.name }}-${{ hashFiles('cmake/ct_cpm.cmake') }}
                  restore-keys: cpm-gui-${{ matrix.name }}-

            # SDL3 needs the X11/Wayland development headers to create
            # desktop windows at all (its CMake aborts without them).
            # Package list straight from the official SDL3 docs:
            # https://wiki.libsdl.org/SDL3/README-linux (Ubuntu 22.04+).
            - name: Install SDL3 build dependencies (Linux)
              if: runner.os == 'Linux' && !contains(matrix.preset, 'mingw')
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                      build-essential git make pkg-config \
                      libasound2-dev libpulse-dev libaudio-dev \
                      libfribidi-dev libjack-dev libsndio-dev \
                      libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
                      libxfixes-dev libxi-dev libxss-dev libxtst-dev \
                      libxkbcommon-dev libdrm-dev libgbm-dev \
                      libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev \
                      libdbus-1-dev libibus-1.0-dev libudev-dev \
                      libthai-dev libusb-1.0-0-dev \
                      libpipewire-0.3-dev libwayland-dev libdecor-0-dev \
                      liburing-dev

            - name: Configure + build + package (RelWithDebInfo)
              run: cmake --workflow --preset ${{ matrix.preset }}-full

            - name: Upload package
              uses: actions/upload-artifact@v7
              with:
                  name: wemod_enhancer_gui-${{ matrix.name }}
                  path: |
                      build/${{ matrix.preset }}/*.zip
                      build/${{ matrix.preset }}/*.tar.xz
                  if-no-files-found: error
