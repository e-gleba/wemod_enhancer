# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: gui_multiplatform_workflow

# GUI-only CI, running in parallel with the base cmake_multiplatform
# workflow: the base one checks version.dll, this one checks
# wemod_enhancer_gui on every supported OS/arch combination.
on:
    push:
        branches: [main]
        paths: &paths
            - "gui/**"
            - "cmake/**"
            - "**/CMakeLists.txt"
            - "CMakePresets.json"
            - ".github/workflows/gui.yml"
    pull_request:
        branches: [main]
        paths: *paths
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm_cache

jobs:
    gui:
        name: gui-${{ matrix.artifact-name }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: windows-2022
                      preset: gui-windows-amd64-full
                      artifact-name: windows-amd64
                      build-dir: build/gui-windows-amd64
                    - os: windows-11-arm
                      preset: gui-windows-arm64-full
                      artifact-name: windows-arm64
                      build-dir: build/gui-windows-arm64
                    - os: ubuntu-24.04
                      preset: gui-linux-amd64-full
                      artifact-name: linux-amd64
                      build-dir: build/gui-linux-amd64
                    - os: ubuntu-24.04-arm
                      preset: gui-linux-arm64-full
                      artifact-name: linux-arm64
                      build-dir: build/gui-linux-arm64

        steps:
            - name: checkout
              uses: actions/checkout@v7

            # SDL3 needs the Wayland/X11 development packages at build
            # time only - at runtime it dlopen's them (see the readme).
            - name: install linux build tools + sdl3 deps
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -y --no-install-recommends \
                      ninja-build \
                      libwayland-dev libxkbcommon-dev libdbus-1-dev \
                      libibus-1.0-dev libdecor-0-dev

            - name: cache cpm sources
              uses: actions/cache@v6
              with:
                  path: .cpm_cache
                  key: cpm-gui-${{ matrix.artifact-name }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
                  restore-keys: cpm-gui-${{ matrix.artifact-name }}-

            - name: build
              run: cmake --workflow --preset ${{ matrix.preset }}

            - name: rename package
              shell: bash
              run: |
                  cd "${{ matrix.build-dir }}"
                  shopt -s nullglob
                  for f in *.zip *.tar.xz; do
                    case "$f" in
                      *.zip)    ext="zip" ;;
                      *.tar.xz) ext="tar.xz" ;;
                    esac
                    mv -- "$f" "wemod_enhancer-gui-${{ matrix.artifact-name }}.$ext"
                  done

            - name: upload package
              uses: actions/upload-artifact@v7
              with:
                  name: gui-${{ matrix.artifact-name }}
                  path: ${{ matrix.build-dir }}/wemod_enhancer-gui-*
                  if-no-files-found: ignore
                  compression-level: 0
