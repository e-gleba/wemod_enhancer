# gui.yml
#
# CI for the opt-in Dear ImGui GUI (WEMOD_ENHANCER_BUILD_GUI). Separate
# from the base version.dll workflow on purpose: the GUI pulls in
# SDL3 + imgui and targets end-user desktops, while the base workflow
# stays a lean Windows-DLL pipeline. Both run in parallel.
#
# The matrix mirrors the base workflow's compiler set for the GUI and
# adds Linux: MSVC + pure Clang on windows-2022, LLVM-MinGW cross on
# ubuntu-24.04, MSVC on windows-11-arm, GCC + Clang on ubuntu-24.04,
# GCC on ubuntu-24.04-arm. No bespoke setup steps: the GitHub runner
# images already ship MSVC / Clang / GCC / Ninja, and the llvm-mingw
# toolchain file (cmake/toolchains/llvm_mingw.cmake) auto-downloads
# the cross compiler on first configure.

name: gui_multiplatform_workflow

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache

jobs:
    build:
        name: ${{ matrix.name }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { name: windows-msvc-amd64,       os: windows-2022,     preset: gui-windows-msvc-amd64 }
                    - { name: windows-clang-amd64,      os: windows-2022,     preset: gui-windows-clang-amd64 }
                    - { name: windows-llvm-mingw-amd64, os: ubuntu-24.04,     preset: gui-windows-llvm-mingw-amd64 }
                    - { name: windows-msvc-arm64,       os: windows-11-arm,   preset: gui-windows-msvc-arm64 }
                    - { name: linux-gcc-amd64,          os: ubuntu-24.04,     preset: gui-linux-gcc-amd64 }
                    - { name: linux-clang-amd64,        os: ubuntu-24.04,     preset: gui-linux-clang-amd64 }
                    - { name: linux-gcc-arm64,          os: ubuntu-24.04-arm, preset: gui-linux-gcc-arm64 }

        steps:
            - uses: actions/checkout@v7

            - name: Restore CPM source cache
              uses: actions/cache@v6
              with:
                  path: ${{ env.CPM_SOURCE_CACHE }}
                  key: cpm-gui-${{ matrix.name }}-${{ hashFiles('cmake/cpm-config.cmake') }}
                  restore-keys: cpm-gui-${{ matrix.name }}-

            - name: Install SDL3 build dependencies (Linux)
              if: runner.os == 'Linux' && !contains(matrix.preset, 'mingw')
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libx11-dev libwayland-dev libxkbcommon-dev libdbus-1-dev libibus-1.0-dev libdecor-0-dev

            - name: Configure + build + package (RelWithDebInfo)
              run: cmake --workflow --preset ${{ matrix.preset }}-full

            - name: Upload package
              uses: actions/upload-artifact@v7
              with:
                  name: wemod_enhancer_gui-${{ matrix.name }}
                  path: |
                      build/${{ matrix.preset }}/*.zip
                      build/${{ matrix.preset }}/*.tar.xz
                  if-no-files-found: error
