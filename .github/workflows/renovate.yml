# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# Self-hosted Renovate: CPM deps (cmake/cpm/*) + llvm-mingw + CPM bootstrap.
# GitHub Actions / Docker are owned by Dependabot (see dependabot.yml).
#
# Token: secrets.RENOVATE_TOKEN (PAT) if set, else GITHUB_TOKEN.
# GITHUB_TOKEN needs "Allow GitHub Actions to create and approve pull requests"
# (Settings -> Actions -> General -> Workflow permissions).
# NOTE: PRs opened by GITHUB_TOKEN do not trigger CI workflows (GitHub
# limitation, not a bug). For CI + automerge on Renovate PRs, add a PAT with
# contents/PR/issues write as RENOVATE_TOKEN.
name: renovate

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/renovate.json5"
      - ".github/workflows/renovate.yml"

concurrency:
  group: renovate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  renovate:
    name: linux_renovate_x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.9
        with:
          configurationFile: .github/renovate.json5
          token: ${{ secrets.RENOVATE_TOKEN || secrets.GITHUB_TOKEN }}
        env:
          LOG_LEVEL: info
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_AUTODISCOVER: "false"
          RENOVATE_ONBOARDING: "false"
