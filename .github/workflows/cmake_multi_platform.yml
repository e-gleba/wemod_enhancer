# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: cmake_multiplatform_workflow

on:
    push:
        branches: [main]
        paths: &paths
            - "src/**"
            - "include/**"
            - "scripts/**"
            - "cmake/**"
            - "**/*.cmake"
            - "**/*.cpp"
            - "**/*.hpp"
            - "**/*.c"
            - "**/*.h"
            - "**/*.cxx"
            - "**/*.hxx"
            - "**/*.py"
            - "**/*.toml"
            - "**/CMakeLists.txt"
            - "CMakePresets.json"
            - ".github/workflows/**"
    pull_request:
        branches: [main]
        paths: *paths
    release:
        types: [published]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm_cache

jobs:
    # ── native builds ───────────────────────────────────────────────────────────
    native:
        name: ${{ matrix.artifact-name }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: windows-2022
                      preset: msvc-full
                      artifact-name: windows-msvc-amd64
                      build-dir: build/msvc
                      install-deps: ''
                    - os: windows-2022
                      preset: clang-windows-amd64-full
                      artifact-name: windows-clang-amd64
                      build-dir: build/clang-windows-amd64
                      install-deps: |-
                          choco install ninja --yes
                          pip install "cmake>=3.31"

        steps:
            - name: checkout
              uses: actions/checkout@v7

            - name: setup python
              if: matrix.install-deps != ''
              uses: actions/setup-python@v7
              with:
                  python-version: "3.13"

            - name: cache cpm sources
              uses: actions/cache@v6
              with:
                  path: .cpm_cache
                  key: cpm-${{ matrix.artifact-name }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
                  restore-keys: cpm-${{ matrix.artifact-name }}-

            - name: install build tools
              if: matrix.install-deps != ''
              run: ${{ matrix.install-deps }}

            - name: build
              run: cmake --workflow --preset ${{ matrix.preset }}

            - name: rename zip artifact
              if: matrix.artifact-name == 'windows-msvc-amd64' || matrix.artifact-name == 'windows-clang-amd64'
              shell: pwsh
              run: |
                  cd ${{ matrix.build-dir }}
                  Get-ChildItem *.zip -ErrorAction SilentlyContinue | ForEach-Object {
                      Rename-Item $_.Name "wemod_enhancer-${{ matrix.artifact-name }}.zip"
                  }

            - name: rename tgz artifact
              if: matrix.artifact-name == 'windows-msvc-amd64' || matrix.artifact-name == 'windows-clang-amd64'
              shell: pwsh
              run: |
                  cd ${{ matrix.build-dir }}
                  Get-ChildItem *.tar.gz -ErrorAction SilentlyContinue | ForEach-Object {
                      Rename-Item $_.Name "wemod_enhancer-${{ matrix.artifact-name }}.tar.gz"
                  }

            - name: upload zip artifact
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ matrix.artifact-name }}-zip
                  path: ${{ matrix.build-dir }}/*.zip
                  if-no-files-found: ignore
                  compression-level: 0

            - name: upload tgz artifact
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ matrix.artifact-name }}-tgz
                  path: ${{ matrix.build-dir }}/*.tar.gz
                  if-no-files-found: ignore
                  compression-level: 0

    # ── cross-compile: Linux → Windows (llvm-mingw) ─────────────────────────────
    cross-windows:
        name: ${{ matrix.artifact-name }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - preset: llvm-mingw-x86_64-full
                      artifact-name: windows-llvm-mingw-amd64
                      build-dir: build/llvm-mingw-x86_64

        steps:
            - name: checkout
              uses: actions/checkout@v7

            - name: install build tools
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -y --no-install-recommends ninja-build

            - name: cache llvm-mingw toolchain
              uses: actions/cache@v6
              with:
                  path: llvm_mingw
                  key: llvm-mingw-${{ hashFiles('cmake/toolchains/llvm_mingw.cmake') }}

            - name: cache cpm sources
              uses: actions/cache@v6
              with:
                  path: .cpm_cache
                  key: cpm-${{ matrix.artifact-name }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
                  restore-keys: cpm-${{ matrix.artifact-name }}-

            - name: build
              run: cmake --workflow --preset ${{ matrix.preset }}

            # Metadata smoke build: the wheel builds without version.dll here
            # (package-data is optional); the release workflow bundles the DLL.
            - name: setup python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.13"

            - name: build python package
              run: |
                  pip install "build>=1.2"
                  python -m build scripts --outdir dist-python

            - name: rename txz artifact
              run: |
                  cd ${{ matrix.build-dir }}
                  for f in *.tar.xz; do
                    [ -f "$f" ] && mv "$f" "wemod_enhancer-${{ matrix.artifact-name }}.tar.xz"
                  done

            - name: upload txz artifact
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ matrix.artifact-name }}-txz
                  path: ${{ matrix.build-dir }}/*.tar.xz
                  if-no-files-found: ignore
                  compression-level: 0
