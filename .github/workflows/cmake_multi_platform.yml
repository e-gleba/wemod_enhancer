# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: cmake_multiplatform_workflow

on:
    push:
        branches: [main]
        paths: &paths
            - "src/**"
            - "include/**"
            - "cmake/**"
            - "**/*.cmake"
            - "**/*.cpp"
            - "**/*.hpp"
            - "**/*.c"
            - "**/*.h"
            - "**/*.cxx"
            - "**/*.hxx"
            - "**/CMakeLists.txt"
            - "CMakePresets.json"
            - ".github/workflows/**"
    pull_request:
        branches: [main]
        paths: *paths
    release:
        types: [published]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm_cache

jobs:
    # ── native builds ───────────────────────────────────────────────────────────
    native:
        name: native / ${{ matrix.artifact-name }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: windows-2022 # Pin to windows-2022 for VS 2022
                      preset: msvc-full
                      artifact-name: windows-msvc
                      install-deps: ''
                    - os: windows-2022 # Pin to windows-2022 (windows-latest has queue issues)
                      preset: clang-windows-amd64-full
                      artifact-name: windows-clang-amd64
                      install-deps: choco install ninja --yes

        steps:
            - name: checkout
              uses: actions/checkout@v7

            - name: cache cpm sources
              uses: actions/cache@v6
              with:
                  path: .cpm_cache
                  key: cpm-${{ matrix.artifact-name }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
                  restore-keys: cpm-${{ matrix.artifact-name }}-

            - name: install build tools
              if: matrix.install-deps != ''
              run: ${{ matrix.install-deps }}

            - name: build
              run: cmake --workflow --preset ${{ matrix.preset }}

            - name: upload zip artifact
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ matrix.artifact-name }}-zip
                  path: build/**/*.zip
                  if-no-files-found: ignore
                  compression-level: 0

            - name: upload tgz artifact
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ matrix.artifact-name }}-tgz
                  path: build/**/*.tar.gz
                  if-no-files-found: ignore
                  compression-level: 0

    # ── cross-compile: Linux → Windows (llvm-mingw) ─────────────────────────────
    cross-windows:
        name: cross-windows / ${{ matrix.artifact-name }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - preset: llvm-mingw-x86_64-full
                      artifact-name: windows-mingw-x86_64

        steps:
            - name: checkout
              uses: actions/checkout@v7

            - name: install build tools
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -y --no-install-recommends ninja-build

            - name: cache llvm-mingw toolchain
              uses: actions/cache@v6
              with:
                  path: llvm_mingw
                  key: llvm-mingw-${{ hashFiles('cmake/toolchains/llvm_mingw.cmake') }}

            - name: cache cpm sources
              uses: actions/cache@v6
              with:
                  path: .cpm_cache
                  key: cpm-${{ matrix.artifact-name }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
                  restore-keys: cpm-${{ matrix.artifact-name }}-

            - name: build
              run: cmake --workflow --preset ${{ matrix.preset }}

            - name: upload txz artifact
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ matrix.artifact-name }}-txz
                  path: build/**/*.tar.xz
                  if-no-files-found: ignore
                  compression-level: 0
