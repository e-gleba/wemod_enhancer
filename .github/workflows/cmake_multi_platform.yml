# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# Single CI pipeline: one matrix, one preset per platform/compiler.
# Every preset builds the full package (GUI + version.dll + patcher).
# Runner images ship MSVC / Clang / GCC / Ninja; the llvm-mingw
# toolchain file auto-downloads the cross compiler on first configure.

name: cmake_multiplatform_workflow

on:
    push:
        branches:
            - main
        paths:
            - 'src/**'
            - 'cmake/**'
            - 'scripts/**'
            - 'CMakeLists.txt'
            - 'CMakePresets.json'
            - '.github/workflows/**'
    pull_request:
        paths:
            - 'src/**'
            - 'cmake/**'
            - 'scripts/**'
            - 'CMakeLists.txt'
            - 'CMakePresets.json'
            - '.github/workflows/**'
    release:
        types: [published]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm_cache

jobs:
    build:
        name: ${{ matrix.preset }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - {
                          preset: windows_msvc_amd64,
                          os: windows-2022,
                      }
                    - {
                          preset: windows_clang_amd64,
                          os: windows-2022,
                      }
                    - {
                          preset: windows_llvm_mingw_amd64,
                          os: ubuntu-24.04,
                      }
                    - {
                          preset: linux_gcc_amd64,
                          os: ubuntu-24.04,
                      }
                    - {
                          preset: linux_clang_amd64,
                          os: ubuntu-24.04,
                      }
                    - {
                          preset: linux_gcc_arm64,
                          os: ubuntu-24.04-arm,
                      }

        steps:
            - uses: actions/checkout@v7

            - name: Restore CPM source cache
              uses: actions/cache@v6
              with:
                  path: ${{ env.CPM_SOURCE_CACHE }}
                  key: cpm-${{ matrix.preset }}-${{ hashFiles('cmake/ct_cpm.cmake') }}
                  restore-keys: cpm-${{ matrix.preset }}-

            # SDL3 needs the X11/Wayland development headers to create
            # desktop windows at all (its CMake aborts without them).
            # Package list straight from the official SDL3 docs:
            # https://wiki.libsdl.org/SDL3/README-linux (Ubuntu 22.04+).
            - name: Install SDL3 build dependencies (Linux)
              if: runner.os == 'Linux' && !contains(matrix.preset, 'mingw')
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                      build-essential git make pkg-config \
                      libasound2-dev libpulse-dev libaudio-dev \
                      libfribidi-dev libjack-dev libsndio-dev \
                      libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
                      libxfixes-dev libxi-dev libxss-dev libxtst-dev \
                      libxkbcommon-dev libdrm-dev libgbm-dev \
                      libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev \
                      libdbus-1-dev libibus-1.0-dev libudev-dev \
                      libthai-dev libusb-1.0-0-dev \
                      libpipewire-0.3-dev libwayland-dev libdecor-0-dev \
                      liburing-dev

            - name: Configure + build + package (RelWithDebInfo)
              run: cmake --workflow --preset ${{ matrix.preset }}_full

            - name: Upload package
              uses: actions/upload-artifact@v7
              with:
                  name: wemod_enhancer-${{ matrix.preset }}
                  path: |
                      build/${{ matrix.preset }}/*.zip
                      build/${{ matrix.preset }}/*.tar.xz
                  if-no-files-found: error
