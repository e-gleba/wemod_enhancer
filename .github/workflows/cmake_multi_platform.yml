# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: cmake_multi_platform_workflow

on:
    push:
        branches: [main]
        paths: &paths
            - "src/**"
            - "cmake/**"
            - "**/*.cmake"
            - "**/*.c"
            - "**/*.h"
            - "**/CMakeLists.txt"
            - "CMakePresets.json"
            - ".github/workflows/**"
    pull_request:
        branches: [main]
        paths: *paths
    release:
        types: [published]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    build:
        name: ${{ matrix.name }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: win-msvc-x64
                      os: windows-2026
                      preset: msvc-full
                      artifact: win-msvc-x64
                      package: build/msvc/*.zip
                    - name: win-llvm-mingw-x64
                      os: ubuntu-latest
                      preset: llvm-mingw-x86_64-full
                      artifact: win-llvm-mingw-x64
                      package: build/llvm-mingw-x86_64/*.tar.xz
        runs-on: ${{ matrix.os }}
        steps:
            - name: checkout
              uses: actions/checkout@v7

            - name: install Ninja
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -y --no-install-recommends ninja-build

            - name: cache LLVM-MinGW
              if: runner.os == 'Linux'
              uses: actions/cache@v6
              with:
                  path: llvm_mingw
                  key: llvm-mingw-${{ hashFiles('cmake/toolchains/llvm_mingw.cmake') }}

            - name: build
              run: cmake --workflow --preset ${{ matrix.preset }}

            - name: upload
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ matrix.artifact }}
                  path: ${{ matrix.package }}
                  if-no-files-found: error
                  compression-level: 0
