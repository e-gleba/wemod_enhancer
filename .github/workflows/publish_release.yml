name: publish_release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: true
        type: string
      previous_tag:
        description: 'Previous tag for release notes diff (leave empty for first release)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm_cache

jobs:
  # ── LLVM-MinGW cross-compile (Linux → Windows) ─────────────────────────────
  windows_llvm_mingw_amd64:
    name: windows-llvm-mingw-amd64
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup_python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: cache_dependencies
        uses: actions/cache@v6
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt', '**/cmake/**/*.cmake') }}

      - name: install_dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          pip install "cmake>=3.31"

      - name: build_and_package
        run: cmake --workflow --preset llvm-mingw-x86_64-full

      - name: rename_artifact
        run: |
          cd build/llvm-mingw-x86_64
          for f in *.tar.xz; do
            mv "$f" "wemod_enhancer-windows-llvm-mingw-amd64.tar.xz"
          done

      - name: upload_artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-llvm-mingw-amd64
          path: build/llvm-mingw-x86_64/*.tar.xz
          if-no-files-found: error

  # ── Linux native (GUI .elf) + combined Linux archive ───────────────────────
  # Builds the GUI natively on Linux (.elf) and the Windows cross package
  # (llvm-mingw), then merges them into one Linux archive that carries the
  # native .elf, the Windows .exe, version.dll and the Python CLI - so a
  # Linux / Steam Deck user gets everything in a single download.
  linux_combined_amd64:
    name: linux-combined-amd64
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup_python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: cache_dependencies
        uses: actions/cache@v6
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt', '**/cmake/**/*.cmake') }}

      - name: install_dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build \
            libwayland-dev libxkbcommon-dev libdbus-1-dev \
            libibus-1.0-dev libdecor-0-dev
          pip install "cmake>=3.31"

      # Native Linux GUI (.elf) + its own package.
      - name: build_linux_native
        run: cmake --workflow --preset linux-native-full

      # Windows cross package (version.dll + wemod_enhancer_gui.exe + python).
      - name: build_windows_cross
        run: cmake --workflow --preset llvm-mingw-x86_64-full

      # Merge: unpack the Windows package, drop the native .elf beside the
      # .exe, repack as the combined Linux archive.
      - name: assemble_combined
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          tar -xf build/llvm-mingw-x86_64/*.tar.xz -C "$work"
          # The package nests everything under a top-level dir; find bin/.
          bin_dir=$(find "$work" -type d -name bin | head -n1)
          cp build/linux-native/gui/Release/wemod_enhancer_gui.elf "$bin_dir/"
          chmod +x "$bin_dir/wemod_enhancer_gui.elf"
          out=wemod_enhancer-linux-combined-amd64.tar.xz
          tar -cJf "$out" -C "$work" .
          mv "$out" build/linux-native/

      - name: upload_artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-combined-amd64
          path: build/linux-native/wemod_enhancer-linux-combined-amd64.tar.xz
          if-no-files-found: error

  # ── Clang Windows AMD64 (MSVC ABI) ─────────────────────────────────────────
  windows_clang_amd64:
    name: windows-clang-amd64
    runs-on: windows-2022
    permissions:
      contents: read
      actions: write
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup_python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: cache_dependencies
        uses: actions/cache@v6
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt', '**/cmake/**/*.cmake') }}

      - name: install_dependencies
        run: |
          choco install ninja --yes
          pip install "cmake>=3.31"

      - name: build_and_package
        run: cmake --workflow --preset clang-windows-amd64-full

      - name: rename_artifact
        shell: pwsh
        run: |
          cd build/clang-windows-amd64
          Get-ChildItem *.zip | Rename-Item -NewName "wemod_enhancer-windows-clang-amd64.zip"

      - name: upload_artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-clang-amd64
          path: build/clang-windows-amd64/*.zip
          if-no-files-found: error

  # ── MSVC Windows AMD64 ─────────────────────────────────────────────────────
  windows_msvc_amd64:
    name: windows-msvc-amd64
    runs-on: windows-2022
    permissions:
      contents: read
      actions: write
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: cache_dependencies
        uses: actions/cache@v6
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt', '**/cmake/**/*.cmake') }}

      - name: build_and_package
        run: cmake --workflow --preset msvc-full

      - name: rename_artifact
        shell: pwsh
        run: |
          cd build/msvc
          Get-ChildItem *.zip | Rename-Item -NewName "wemod_enhancer-windows-msvc-amd64.zip"

      - name: upload_artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-msvc-amd64
          path: build/msvc/*.zip
          if-no-files-found: error

  # ── Create GitHub Release ──────────────────────────────────────────────────
  release:
    name: Create Release
    needs: [windows_llvm_mingw_amd64, windows_clang_amd64, windows_msvc_amd64, linux_combined_amd64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: configure_git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: create_and_push_tag
        run: |
          git tag -a ${{ inputs.version }} -m "release ${{ inputs.version }}"
          git push origin ${{ inputs.version }}

      - name: download_llvm_mingw_artifact
        uses: actions/download-artifact@v8
        with:
          name: windows-llvm-mingw-amd64
          path: artifacts/

      - name: download_clang_windows_artifact
        uses: actions/download-artifact@v8
        with:
          name: windows-clang-amd64
          path: artifacts/

      - name: download_msvc_windows_artifact
        uses: actions/download-artifact@v8
        with:
          name: windows-msvc-amd64
          path: artifacts/

      - name: download_linux_combined_artifact
        uses: actions/download-artifact@v8
        with:
          name: linux-combined-amd64
          path: artifacts/

      - name: generate_release_notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          args=(-f tag_name="${{ inputs.version }}" -f target_commitish="main")
          if [ -n "${{ inputs.previous_tag }}" ]; then
            args+=(-f previous_tag_name="${{ inputs.previous_tag }}")
          fi
          gh api repos/${{ github.repository }}/releases/generate-notes \
            "${args[@]}" --jq '.body' > release_notes.md
          echo "notes_file=release_notes.md" >> "$GITHUB_OUTPUT"

      - name: create_github_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create \
            "${{ inputs.version }}" \
            --title "${{ inputs.version }}" \
            --notes-file release_notes.md \
            artifacts/*
