name: publish_release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: true
        type: string
      previous_tag:
        description: 'Previous tag for release notes diff (leave empty for first release)'
        required: false
        type: string
        default: ''
      next_version:
        description: 'Next CMake project version, no v prefix (e.g. 1.0.5) - bot commits it to main after the release'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm_cache

jobs:
  # ── LLVM-MinGW cross-compile (Linux → Windows) ─────────────────────────────
  windows_llvm_mingw_amd64:
    name: windows-llvm-mingw-amd64
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup_python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: cache_dependencies
        uses: actions/cache@v6
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt', '**/cmake/**/*.cmake') }}

      - name: install_dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          pip install "cmake>=3.31"

      - name: build_and_package
        run: cmake --workflow --preset windows_llvm_mingw_amd64_full

      - name: rename_artifact
        run: |
          cd build/windows_llvm_mingw_amd64
          for f in *.tar.xz; do
            mv "$f" "wemod_enhancer-windows-llvm-mingw-amd64.tar.xz"
          done

      - name: upload_artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-llvm-mingw-amd64
          path: build/windows_llvm_mingw_amd64/*.tar.xz
          if-no-files-found: error

  # ── Clang Windows AMD64 (MSVC ABI) ─────────────────────────────────────────
  windows_clang_amd64:
    name: windows-clang-amd64
    runs-on: windows-2022
    permissions:
      contents: read
      actions: write
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup_python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: cache_dependencies
        uses: actions/cache@v6
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt', '**/cmake/**/*.cmake') }}

      - name: install_dependencies
        run: |
          choco install ninja --yes
          pip install "cmake>=3.31"

      - name: build_and_package
        run: cmake --workflow --preset windows_clang_amd64_full

      - name: rename_artifact
        shell: pwsh
        run: |
          cd build/windows_clang_amd64
          Get-ChildItem *.zip | Rename-Item -NewName "wemod_enhancer-windows-clang-amd64.zip"

      - name: upload_artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-clang-amd64
          path: build/windows_clang_amd64/*.zip
          if-no-files-found: error

  # ── MSVC Windows AMD64 ─────────────────────────────────────────────────────
  windows_msvc_amd64:
    name: windows-msvc-amd64
    runs-on: windows-2022
    permissions:
      contents: read
      actions: write
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: cache_dependencies
        uses: actions/cache@v6
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt', '**/cmake/**/*.cmake') }}

      - name: build_and_package
        run: cmake --workflow --preset windows_msvc_amd64_full

      - name: rename_artifact
        shell: pwsh
        run: |
          cd build/windows_msvc_amd64
          Get-ChildItem *.zip | Rename-Item -NewName "wemod_enhancer-windows-msvc-amd64.zip"

      - name: upload_artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-msvc-amd64
          path: build/windows_msvc_amd64/*.zip
          if-no-files-found: error

  # ── GCC Linux AMD64 ────────────────────────────────────────────────────────
  linux_gcc_amd64:
    name: linux-gcc-amd64
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: cache_dependencies
        uses: actions/cache@v6
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt', '**/cmake/**/*.cmake') }}

      # SDL3 needs the X11/Wayland development headers to create
      # desktop windows at all (its CMake aborts without them).
      # Package list straight from the official SDL3 docs:
      # https://wiki.libsdl.org/SDL3/README-linux (Ubuntu 22.04+).
      - name: install_sdl3_dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              build-essential git make pkg-config \
              libasound2-dev libpulse-dev libaudio-dev \
              libfribidi-dev libjack-dev libsndio-dev \
              libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
              libxfixes-dev libxi-dev libxss-dev libxtst-dev \
              libxkbcommon-dev libdrm-dev libgbm-dev \
              libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev \
              libdbus-1-dev libibus-1.0-dev libudev-dev \
              libthai-dev libusb-1.0-0-dev \
              libpipewire-0.3-dev libwayland-dev libdecor-0-dev \
              liburing-dev

      - name: build_and_package
        run: cmake --workflow --preset linux_gcc_amd64_full

      - name: rename_artifact
        run: |
          cd build/linux_gcc_amd64
          for f in *.tar.xz; do
            mv "$f" "wemod_enhancer-linux-amd64.tar.xz"
          done

      - name: upload_artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-amd64
          path: build/linux_gcc_amd64/*.tar.xz
          if-no-files-found: error

  # ── Clang Linux AMD64 (matches the local Linux toolchain) ──────────────────
  linux_clang_amd64:
    name: linux-clang-amd64
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: cache_dependencies
        uses: actions/cache@v6
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-clang-${{ hashFiles('**/CMakeLists.txt', '**/cmake/**/*.cmake') }}

      - name: install_sdl3_dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              build-essential git make pkg-config clang lld ninja-build \
              libasound2-dev libpulse-dev libaudio-dev \
              libfribidi-dev libjack-dev libsndio-dev \
              libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
              libxfixes-dev libxi-dev libxss-dev libxtst-dev \
              libxkbcommon-dev libdrm-dev libgbm-dev \
              libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev \
              libdbus-1-dev libibus-1.0-dev libudev-dev \
              libthai-dev libusb-1.0-0-dev \
              libpipewire-0.3-dev libwayland-dev libdecor-0-dev \
              liburing-dev

      - name: build_and_package
        run: cmake --workflow --preset linux_clang_amd64_full

      - name: rename_artifact
        run: |
          cd build/linux_clang_amd64
          for f in *.tar.xz; do
            mv "$f" "wemod_enhancer-linux-clang-amd64.tar.xz"
          done

      - name: upload_artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-clang-amd64
          path: build/linux_clang_amd64/*.tar.xz
          if-no-files-found: error

  # ── GCC Linux ARM64 (Steam Deck / ARM handhelds) ───────────────────────────
  linux_gcc_arm64:
    name: linux-gcc-arm64
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      actions: write
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: cache_dependencies
        uses: actions/cache@v6
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt', '**/cmake/**/*.cmake') }}

      - name: install_sdl3_dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              build-essential git make pkg-config \
              libasound2-dev libpulse-dev libaudio-dev \
              libfribidi-dev libjack-dev libsndio-dev \
              libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
              libxfixes-dev libxi-dev libxss-dev libxtst-dev \
              libxkbcommon-dev libdrm-dev libgbm-dev \
              libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev \
              libdbus-1-dev libibus-1.0-dev libudev-dev \
              libthai-dev libusb-1.0-0-dev \
              libpipewire-0.3-dev libwayland-dev libdecor-0-dev \
              liburing-dev

      - name: build_and_package
        run: cmake --workflow --preset linux_gcc_arm64_full

      - name: rename_artifact
        run: |
          cd build/linux_gcc_arm64
          for f in *.tar.xz; do
            mv "$f" "wemod_enhancer-linux-arm64.tar.xz"
          done

      - name: upload_artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-arm64
          path: build/linux_gcc_arm64/*.tar.xz
          if-no-files-found: error

  # ── Create GitHub Release ──────────────────────────────────────────────────
  release:
    name: Create Release
    needs:
      - windows_llvm_mingw_amd64
      - windows_clang_amd64
      - windows_msvc_amd64
      - linux_gcc_amd64
      - linux_clang_amd64
      - linux_gcc_arm64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: configure_git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: create_and_push_tag
        run: |
          git tag -a ${{ inputs.version }} -m "release ${{ inputs.version }}"
          git push origin ${{ inputs.version }}

      - name: download_llvm_mingw_artifact
        uses: actions/download-artifact@v8
        with:
          name: windows-llvm-mingw-amd64
          path: artifacts/

      - name: download_clang_windows_artifact
        uses: actions/download-artifact@v8
        with:
          name: windows-clang-amd64
          path: artifacts/

      - name: download_msvc_windows_artifact
        uses: actions/download-artifact@v8
        with:
          name: windows-msvc-amd64
          path: artifacts/

      - name: download_linux_amd64_artifact
        uses: actions/download-artifact@v8
        with:
          name: linux-amd64
          path: artifacts/

      - name: download_linux_clang_amd64_artifact
        uses: actions/download-artifact@v8
        with:
          name: linux-clang-amd64
          path: artifacts/

      - name: download_linux_arm64_artifact
        uses: actions/download-artifact@v8
        with:
          name: linux-arm64
          path: artifacts/

      - name: generate_release_notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          args=(-f tag_name="${{ inputs.version }}" -f target_commitish="main")
          if [ -n "${{ inputs.previous_tag }}" ]; then
            args+=(-f previous_tag_name="${{ inputs.previous_tag }}")
          fi
          gh api repos/${{ github.repository }}/releases/generate-notes \
            "${args[@]}" --jq '.body' > release_notes.md
          echo "notes_file=release_notes.md" >> "$GITHUB_OUTPUT"

      - name: create_github_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create \
            "${{ inputs.version }}" \
            --title "${{ inputs.version }}" \
            --notes-file release_notes.md \
            artifacts/*

  # ── Post-release: bump CMake project version on main ───────────────────────
  # Runs only after the release is published, so the tag and the
  # just-built artifacts stay untouched. This prepares main for the NEXT
  # release: packages always ship the project() version of their own tag.
  bump_cmake_version:
    name: Bump CMake version on main
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Two release runs must never rebase-race the version commit:
    # queue the bump jobs, never cancel them mid-push.
    concurrency:
      group: post-release-cmake-version-bump
      cancel-in-progress: false
    env:
      # Bound once via env - never expand a workflow input into shell
      # source (zizmor template-injection).
      NEXT_VERSION: ${{ inputs.next_version }}
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: validate_next_version
        run: |
          if [[ ! "$NEXT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf "::error::next_version must be plain semver, no v prefix (e.g. 1.0.5) - got '%s'\n" "$NEXT_VERSION"
            exit 1
          fi
          current=$(grep -E '^[[:space:]]*VERSION[[:space:]]+[0-9]+\.[0-9]+\.[0-9]+[[:space:]]*$' CMakeLists.txt | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)
          if [[ -z "$current" ]]; then
            echo "::error::could not read the current project version from CMakeLists.txt"
            exit 1
          fi
          # sort -V ordering: the smaller of the two sorts first, so an
          # equal or lower next_version sorts first - reject both.
          lowest=$(printf '%s\n%s\n' "$current" "$NEXT_VERSION" | sort -V | head -n1)
          if [[ "$lowest" == "$NEXT_VERSION" ]]; then
            printf "::error::next_version (%s) must be greater than the current project version (%s)\n" "$NEXT_VERSION" "$current"
            exit 1
          fi

      - name: bump_project_version
        run: |
          sed -i -E "s/^([[:space:]]*VERSION[[:space:]]+)[0-9]+\.[0-9]+\.[0-9]+[[:space:]]*$/\1$NEXT_VERSION/" CMakeLists.txt
          grep -E "^[[:space:]]*VERSION[[:space:]]+$NEXT_VERSION[[:space:]]*$" CMakeLists.txt

      - name: commit_and_push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt
          git commit -m "chore: bump CMake project version to $NEXT_VERSION"
          git pull --rebase origin main
          git push origin HEAD:main
