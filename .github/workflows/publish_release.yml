# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: publish_release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (e.g. v1.0.2)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name || inputs.tag }}
  cancel-in-progress: false

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm_cache

# Every job builds the same self-contained package for its platform:
# GUI + version.dll + wemod_enhancer.py, nothing downloaded at runtime.
jobs:
  # ── LLVM-MinGW cross-compile (Linux → Windows) ─────────────────────────────
  windows_llvm_mingw_amd64:
    name: windows_llvm_mingw_amd64
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: install_build_tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build

      - name: cache_llvm_mingw_toolchain
        uses: actions/cache@v6
        with:
          path: llvm_mingw
          key: llvm-mingw-${{ hashFiles('cmake/toolchains/llvm_mingw.cmake') }}

      - name: install_cmake
        run: pip install "cmake>=3.31"

      - name: build_and_package
        run: cmake --workflow --preset windows_llvm_mingw_amd64_full

      - name: rename_artifact
        run: |
          cd build/windows_llvm_mingw_amd64
          for f in *.tar.xz; do
            mv "$f" "wemod_enhancer-windows-llvm-mingw-amd64.tar.xz"
          done

      - name: upload_artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-llvm-mingw-amd64
          path: build/windows_llvm_mingw_amd64/*.tar.xz
          if-no-files-found: error

  # ── Clang Windows AMD64 (MSVC ABI) ─────────────────────────────────────────
  windows_clang_amd64:
    name: windows_clang_amd64
    runs-on: windows-2022
    permissions:
      contents: read
      actions: write
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: cache_dependencies
        uses: actions/cache@v6
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt', '**/cmake/**/*.cmake') }}

      - name: install_ninja
        run: choco install ninja --yes

      - name: setup_python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: install_cmake
        run: pip install "cmake>=3.31"

      - name: build_and_package
        run: cmake --workflow --preset windows_clang_amd64_full

      - name: rename_artifact
        shell: pwsh
        run: |
          cd build/windows_clang_amd64
          Get-ChildItem *.zip | Rename-Item -NewName "wemod_enhancer-windows-clang-amd64.zip"

      - name: upload_artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-clang-amd64
          path: build/windows_clang_amd64/*.zip
          if-no-files-found: error

  # ── MSVC Windows AMD64 ─────────────────────────────────────────────────────
  windows_msvc_amd64:
    name: windows_msvc_amd64
    runs-on: windows-2022
    permissions:
      contents: read
      actions: write
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: cache_dependencies
        uses: actions/cache@v6
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt', '**/cmake/**/*.cmake') }}

      - name: build_and_package
        run: cmake --workflow --preset windows_msvc_amd64_full

      - name: rename_artifact
        shell: pwsh
        run: |
          cd build/windows_msvc_amd64
          Get-ChildItem *.zip | Rename-Item -NewName "wemod_enhancer-windows-msvc-amd64.zip"

      - name: upload_artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-msvc-amd64
          path: build/windows_msvc_amd64/*.zip
          if-no-files-found: error

  # ── GCC Linux AMD64 ────────────────────────────────────────────────────────
  linux_gcc_amd64:
    name: linux_gcc_amd64
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: cache_dependencies
        uses: actions/cache@v6
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-gui-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt', '**/cmake/**/*.cmake') }}

      - name: install_build_dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              build-essential git make ninja-build pkg-config \
              libasound2-dev libpulse-dev libaudio-dev \
              libfribidi-dev libjack-dev libsndio-dev \
              libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
              libxfixes-dev libxi-dev libxss-dev libxtst-dev \
              libxkbcommon-dev libdrm-dev libgbm-dev \
              libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev \
              libdbus-1-dev libibus-1.0-dev libudev-dev \
              libthai-dev libusb-1.0-0-dev \
              libpipewire-0.3-dev libwayland-dev libdecor-0-dev \
              liburing-dev

      - name: build_and_package
        run: cmake --workflow --preset linux_gcc_amd64_full

      - name: rename_artifact
        run: |
          cd build/linux_gcc_amd64
          for f in *.tar.xz; do
            mv "$f" "wemod_enhancer-linux-amd64.tar.xz"
          done

      - name: upload_artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-amd64
          path: build/linux_gcc_amd64/*.tar.xz
          if-no-files-found: error

  # ── GCC Linux ARM64 (Steam Deck / ARM handhelds) ───────────────────────────
  linux_gcc_arm64:
    name: linux_gcc_arm64
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      actions: write
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: cache_dependencies
        uses: actions/cache@v6
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-gui-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt', '**/cmake/**/*.cmake') }}

      - name: install_build_dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              build-essential git make ninja-build pkg-config \
              libasound2-dev libpulse-dev libaudio-dev \
              libfribidi-dev libjack-dev libsndio-dev \
              libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
              libxfixes-dev libxi-dev libxss-dev libxtst-dev \
              libxkbcommon-dev libdrm-dev libgbm-dev \
              libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev \
              libdbus-1-dev libibus-1.0-dev libudev-dev \
              libthai-dev libusb-1.0-0-dev \
              libpipewire-0.3-dev libwayland-dev libdecor-0-dev \
              liburing-dev

      - name: build_and_package
        run: cmake --workflow --preset linux_gcc_arm64_full

      - name: rename_artifact
        run: |
          cd build/linux_gcc_arm64
          for f in *.tar.xz; do
            mv "$f" "wemod_enhancer-linux-arm64.tar.xz"
          done

      - name: upload_artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-arm64
          path: build/linux_gcc_arm64/*.tar.xz
          if-no-files-found: error

  # ── Create GitHub Release ──────────────────────────────────────────────────
  create_release:
    name: create_release
    needs:
      - windows_llvm_mingw_amd64
      - windows_clang_amd64
      - windows_msvc_amd64
      - linux_gcc_amd64
      - linux_gcc_arm64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: validate_tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: tag '$RELEASE_TAG' does not match vX.Y.Z"
            exit 1
          fi

      - name: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: download_llvm_mingw_artifact
        uses: actions/download-artifact@v8
        with:
          name: windows-llvm-mingw-amd64
          path: artifacts/

      - name: download_clang_artifact
        uses: actions/download-artifact@v8
        with:
          name: windows-clang-amd64
          path: artifacts/

      - name: download_msvc_artifact
        uses: actions/download-artifact@v8
        with:
          name: windows-msvc-amd64
          path: artifacts/

      - name: download_linux_amd64_artifact
        uses: actions/download-artifact@v8
        with:
          name: linux-amd64
          path: artifacts/

      - name: download_linux_arm64_artifact
        uses: actions/download-artifact@v8
        with:
          name: linux-arm64
          path: artifacts/

      - name: generate_release_notes
        run: |
          {
            echo "## wemod_enhancer ${RELEASE_TAG}"
            echo ""
            echo "### What's Changed"
            echo ""
            git log --pretty=format:"- %s (\\\\`%h\\\\`)" $(git describe --tags --abbrev=0 ${RELEASE_TAG}^ 2>/dev/null || echo "HEAD~10")..${RELEASE_TAG} 2>/dev/null || git log --pretty=format:"- %s (\\\\`%h\\\\`)" -10
            echo ""
            echo "### Checksums"
            echo ""
            echo '```'
            (cd artifacts && sha256sum *.zip *.tar.xz 2>/dev/null || sha256sum *)
            echo '```'
          } > release_notes.md

      - name: create_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: wemod_enhancer ${{ env.RELEASE_TAG }}
          body_path: release_notes.md
          files: artifacts/*
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
