<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="weTitle weDesc">
<title id="weTitle">WeMod Enhancer</title>
<desc id="weDesc">Hacker terminal: W glyph with blinking block cursor, patch --pro prompt, PRO unlocked status.</desc>
<rect width="256" height="256" rx="56" fill="#0d1117"/>
<rect x="2" y="2" width="252" height="252" rx="54" fill="none" stroke="#30363d" stroke-width="3"/>
<circle cx="42" cy="38" r="8" fill="#ff5f56"/>
<circle cx="66" cy="38" r="8" fill="#ebbd2d"/>
<circle cx="90" cy="38" r="8" fill="#27c93f"/>
<text x="128" y="43" text-anchor="middle" font-family="Menlo,Consolas,monospace" font-size="13" fill="#8b949e">wemod_enhancer</text>
<line x1="24" y1="60" x2="232" y2="60" stroke="#21262d" stroke-width="2"/>
<text x="128" y="82" text-anchor="middle" font-family="Menlo,Consolas,monospace" font-size="11" fill="#484f58" opacity="0.5" letter-spacing="2">0x57 0x45 0x50 0x52 0x4F</text>
<polyline points="58,94 82,156 106,106 130,156 154,94" fill="none" stroke="#f0f6fc" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="166" y="100" width="20" height="52" rx="4" fill="#e3b341"><animate attributeName="opacity" values="1;1;1;0;0;1;1" keyTimes="0;0.5;0.55;0.85;0.9;1" dur="1.2s" repeatCount="indefinite"/></rect>
<text x="54" y="190" font-family="Menlo,Consolas,monospace" font-size="16"><tspan fill="#3fb950" font-weight="bold">$</tspan><tspan fill="#8b949e"> patch --pro</tspan></text>
<text x="54" y="214" font-family="Menlo,Consolas,monospace" font-size="16" font-weight="bold"><tspan fill="#3fb950">[ok]</tspan><tspan fill="#f0f6fc"> PRO unlocked</tspan></text>
</svg>
