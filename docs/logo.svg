<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1a1a2e"/>
      <stop offset="1" stop-color="#0f0f1a"/>
    </linearGradient>
    <linearGradient id="hexGrad" x1="32" y1="32" x2="224" y2="224" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00d4aa"/>
      <stop offset="0.5" stop-color="#00b894"/>
      <stop offset="1" stop-color="#0984e3"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="48" y1="96" x2="208" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe6e9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="256" height="256" rx="48" fill="url(#bgGrad)"/>

  <!-- Outer hexagon ring -->
  <path d="M128 28 L212 76 L212 180 L128 228 L44 180 L44 76 Z"
        stroke="url(#hexGrad)" stroke-width="6" fill="none" stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Inner hexagon (slightly smaller, filled, semi-transparent) -->
  <path d="M128 48 L194 84 L194 172 L128 208 L62 172 L62 84 Z"
        fill="url(#hexGrad)" fill-opacity="0.08" stroke="url(#hexGrad)" stroke-width="2"
        stroke-linejoin="round"/>

  <!-- Circuit/patch lines emanating from corners (represents ASAR-fuse proxy patching) -->
  <g stroke="url(#hexGrad)" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.5">
    <!-- Top-left circuit -->
    <path d="M62 84 L40 62 L28 62"/>
    <circle cx="28" cy="62" r="3" fill="url(#hexGrad)"/>
    <!-- Top-right circuit -->
    <path d="M194 84 L216 62 L228 62"/>
    <circle cx="228" cy="62" r="3" fill="url(#hexGrad)"/>
    <!-- Bottom-left circuit -->
    <path d="M62 172 L40 194 L28 194"/>
    <circle cx="28" cy="194" r="3" fill="url(#hexGrad)"/>
    <!-- Bottom-right circuit -->
    <path d="M194 172 L216 194 L228 194"/>
    <circle cx="228" cy="194" r="3" fill="url(#hexGrad)"/>
  </g>

  <!-- WE monogram text -->
  <text x="128" y="140" text-anchor="middle" dominant-baseline="central"
        font-family="'Segoe UI', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
        font-size="72" font-weight="800" letter-spacing="-2"
        fill="url(#textGrad)" filter="url(#glow)">
    WE
  </text>

  <!-- Enhancer subtitle bar -->
  <rect x="80" y="160" width="96" height="3" rx="1.5" fill="url(#hexGrad)" opacity="0.8"/>
  <text x="128" y="178" text-anchor="middle" dominant-baseline="central"
        font-family="'Segoe UI', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
        font-size="16" font-weight="600" letter-spacing="4"
        fill="url(#hexGrad)">
    ENHANCER
  </text>
</svg>
